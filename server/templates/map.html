{% extends "base.html" %}
{% block title %}Map{% endblock %}
{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  body { padding: 0; }
  main { max-width: none; }
  #layout { display: flex; flex-direction: column; height: 100vh; }
  #bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem;
         padding: .6rem 1rem; border-bottom: 1px solid #8884; }
  #map { flex: 1 1 auto; min-height: 0; width: 100%; }
  #legend { flex: 0 0 auto; max-height: 30vh; overflow-y: auto; border-top: 1px solid #8884;
            padding: .5rem 1rem .8rem; }
  #legend h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em;
               opacity: .6; margin: .3rem 0 .4rem; }
  .legend-row { display: flex; align-items: center; gap: .6rem; padding: .25rem 0; }
  .legend-row .dot { width: 18px; height: 18px; border-radius: 50%; flex: none;
                     display: flex; align-items: center; justify-content: center; }
  .legend-row .dot::after { content: ""; width: 7px; height: 7px; border-radius: 50%;
                            background: var(--core); border: 2px solid #fff; }
  .legend-row .name { flex: 1 1 auto; }
  .legend-row .age { font-size: .85rem; opacity: .7; }
  .legend-row input[type=checkbox] { width: 1.1rem; height: 1.1rem; accent-color: #1e7a46; }
  .legend-row.hidden-device .name, .legend-row.hidden-device .age { opacity: .4; }
  #status { font-size: .85rem; opacity: .7; }
  .device-marker { background: transparent; border: none; }
  .device-marker .outer { width: 22px; height: 22px; border-radius: 50%;
                          display: flex; align-items: center; justify-content: center; }
  .device-marker .inner { width: 8px; height: 8px; border-radius: 50%; border: 3px solid #fff; }
</style>
{% endblock %}
{% block content %}
<div id="layout">
  <div id="bar">
    <div><a href="/">← devices</a> &nbsp; <strong>Map</strong></div>
    <div id="status">connecting…</div>
  </div>
  <div id="map"></div>
  <div id="legend">
    <h2>Legend</h2>
    <div id="legend-rows"></div>
  </div>
</div>
<script>
  // The devices this user is approved to follow, in stable order; each device's colour is its
  // position in this list, mirroring the app's palette so the same set gets the same colours.
  const devices = {{ devices | tojson }};

  const PALETTE = [
    '#8E24AA', '#EF6C00', '#00838F', '#6D4C41', '#AD1457', '#4527A0', '#558B2F', '#00695C',
    '#D84315', '#283593', '#9E9D24', '#6A1B9A', '#37474F', '#C2185B', '#0277BD', '#4E342E',
  ];

  function deviceColor(index) {
    if (index < PALETTE.length) return PALETTE[index];
    // Golden-angle hue stepping keeps generated colours far apart, like the app.
    const hue = ((index - PALETTE.length) * 137.508) % 360;
    return `hsl(${hue}, 70%, 38%)`;
  }

  function lighten(color) {
    // The marker's outer disc: the base colour at low opacity over the map.
    return color;
  }

  const map = L.map('map').setView([50.8503, 4.3517], 8);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const status = document.getElementById('status');
  const legendRows = document.getElementById('legend-rows');
  const markers = new Map();   // device id -> Leaflet marker
  const rows = new Map();      // device id -> {row, age}
  let firstFit = true;

  // Per-browser show/hide choices survive reloads.
  const HIDDEN_KEY = 'gpstrack-hidden-devices';
  const hidden = new Set(JSON.parse(localStorage.getItem(HIDDEN_KEY) || '[]'));
  function persistHidden() {
    localStorage.setItem(HIDDEN_KEY, JSON.stringify([...hidden]));
  }

  function markerIcon(color) {
    return L.divIcon({
      className: 'device-marker',
      iconSize: [22, 22],
      iconAnchor: [11, 11],
      html: `<div class="outer" style="background:${color}55">` +
            `<div class="inner" style="background:${color}"></div></div>`,
    });
  }

  devices.forEach((device, index) => {
    const color = deviceColor(index);
    device.color = color;

    const row = document.createElement('label');
    row.className = 'legend-row' + (hidden.has(device.id) ? ' hidden-device' : '');
    row.innerHTML =
      `<span class="dot" style="background:${color}40; --core:${color}"></span>` +
      `<span class="name"></span><span class="age">no fix yet</span>`;
    row.querySelector('.name').textContent = device.label;

    const toggle = document.createElement('input');
    toggle.type = 'checkbox';
    toggle.checked = !hidden.has(device.id);
    toggle.addEventListener('change', () => {
      if (toggle.checked) hidden.delete(device.id); else hidden.add(device.id);
      persistHidden();
      row.classList.toggle('hidden-device', !toggle.checked);
      const marker = markers.get(device.id);
      if (marker) {
        if (toggle.checked) marker.addTo(map); else marker.remove();
      }
    });
    row.appendChild(toggle);

    legendRows.appendChild(row);
    rows.set(device.id, { row, age: row.querySelector('.age') });
  });

  if (devices.length === 0) {
    legendRows.innerHTML = '<p class="muted">You are not approved to follow any device yet. ' +
      'Request follows from the <a href="/">device list</a>.</p>';
    status.textContent = '';
  }

  function formatAge(seconds) {
    if (seconds < 15) return 'just now';
    if (seconds < 90) return '1 min ago';
    if (seconds < 3600) return Math.floor(seconds / 60) + ' min ago';
    return Math.floor(seconds / 3600) + ' h ago';
  }

  async function poll() {
    if (devices.length === 0) return;
    try {
      const res = await fetch('/api/locations', { cache: 'no-store' });
      if (!res.ok) { status.textContent = 'Error ' + res.status; return; }
      const data = await res.json();
      const now = Date.now() / 1000;
      const visiblePoints = [];

      data.devices.forEach(p => {
        const ui = rows.get(p.id);
        const device = devices.find(d => d.id === p.id);
        if (!ui || !device) return;

        if (p.lat == null) {
          ui.age.textContent = 'offline';
          const marker = markers.get(p.id);
          if (marker) { marker.remove(); markers.delete(p.id); }
          return;
        }

        ui.age.textContent = formatAge(Math.max(0, Math.round(now - p.time)));
        let marker = markers.get(p.id);
        if (!marker) {
          marker = L.marker([p.lat, p.lon], { icon: markerIcon(device.color) })
            .bindTooltip(p.label);
          markers.set(p.id, marker);
          if (!hidden.has(p.id)) marker.addTo(map);
        } else {
          marker.setLatLng([p.lat, p.lon]);
        }
        if (!hidden.has(p.id)) visiblePoints.push([p.lat, p.lon]);
      });

      // Frame everyone once, then leave the camera to the reader.
      if (firstFit && visiblePoints.length > 0) {
        firstFit = false;
        if (visiblePoints.length === 1) {
          map.setView(visiblePoints[0], 15);
        } else {
          map.fitBounds(L.latLngBounds(visiblePoints).pad(0.25));
        }
      }

      const online = data.devices.filter(p => p.lat != null).length;
      status.textContent = online + '/' + data.devices.length + ' broadcasting';
    } catch (e) {
      status.textContent = 'offline';
    }
  }
  poll();
  setInterval(poll, 5000);
</script>
{% endblock %}
