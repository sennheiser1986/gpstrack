{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<h1>Change your password</h1>
{% if forced %}<p class="muted">Your password was set by the administrator — please choose your own.</p>{% endif %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/change-password">
  <label class="field"><span>Current password</span>
    <input type="password" name="current" autocomplete="current-password" required></label>
  <label class="field"><span>New password (min 8 characters)</span>
    <input type="password" name="new_password" autocomplete="new-password" minlength="8" required></label>
  <button type="submit">Save</button>
</form>
{% endblock %}
