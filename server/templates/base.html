<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GPS Track{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0; padding: 2rem 1rem; background: Canvas; color: CanvasText;
    }
    main { max-width: 880px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    h2 { font-size: 1.05rem; margin: 2rem 0 .5rem; }
    a { color: #2f6fb0; }
    table { border-collapse: collapse; width: 100%; margin: .5rem 0 1rem; }
    th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid #8884; vertical-align: middle; }
    th { font-weight: 600; font-size: .82rem; text-transform: uppercase; letter-spacing: .03em; opacity: .7; }
    form.inline { display: inline; }
    input[type=text], input[type=password] {
      font: inherit; padding: .45rem .55rem; border: 1px solid #8886; border-radius: 6px;
      background: Field; color: FieldText; min-width: 12rem;
    }
    button {
      font: inherit; padding: .45rem .8rem; border: 1px solid #2f6fb0; border-radius: 6px;
      background: #2f6fb0; color: #fff; cursor: pointer;
    }
    button.secondary { background: transparent; color: #2f6fb0; }
    button.danger { background: #b3261e; border-color: #b3261e; }
    .card {
      border: 1px solid #8884; border-radius: 10px; padding: 1rem 1.2rem; margin: 1rem 0;
      background: color-mix(in srgb, Canvas 92%, CanvasText);
    }
    .muted { opacity: .65; }
    .pill { font-size: .78rem; padding: .1rem .5rem; border-radius: 999px; border: 1px solid #8886; }
    .pill.online { border-color: #2e7d32; color: #2e7d32; }
    .pill.approved { border-color: #2e7d32; color: #2e7d32; }
    .pill.pending { border-color: #b06f00; color: #b06f00; }
    .pill.denied { border-color: #b3261e; color: #b3261e; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    .topbar { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1rem; }
    .error { color: #b3261e; margin: .5rem 0; }
    .field { display: block; margin: .6rem 0; }
    .field span { display: block; font-size: .82rem; opacity: .7; margin-bottom: .2rem; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
