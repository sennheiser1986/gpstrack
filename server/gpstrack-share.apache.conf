# Apache reverse proxy for the GPS Track sharing server.
#
#   sudo a2enmod proxy proxy_http headers
#   sudo cp gpstrack-share.apache.conf /etc/apache2/sites-available/gpstrack-share.conf
#   # set ServerName below
#   sudo a2ensite gpstrack-share && sudo systemctl reload apache2
#   sudo certbot --apache -d gpstrack.example.org
#
# certbot copies this into a :443 vhost and adds an HTTP->HTTPS redirect. The
# X-Forwarded-Proto header below is connection-aware, so it stays correct in both vhosts.

<VirtualHost *:80>
    ServerName gpstrack.example.org

    # Let certbot answer ACME challenges directly instead of proxying them to the app.
    ProxyPass /.well-known/acme-challenge/ !

    ProxyPreserveHost On
    ProxyPass        /  http://127.0.0.1:8080/  retry=0
    ProxyPassReverse /  http://127.0.0.1:8080/

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS

    ErrorLog  ${APACHE_LOG_DIR}/gpstrack-share-error.log
    CustomLog ${APACHE_LOG_DIR}/gpstrack-share-access.log combined
</VirtualHost>
